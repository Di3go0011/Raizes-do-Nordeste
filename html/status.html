<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status do Pedido | Raízes do Nordeste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card mx-auto shadow-sm" style="max-width: 600px;">
            <div class="card-body text-center p-4">
                <h3 class="mb-2">Acompanhamento do Pedido</h3>
                <p class="text-muted mb-4">Número do Pedido: <strong id="numPedido">#000000</strong></p>

                <div class="alert alert-warning py-3" id="caixaStatus">
                    <h4 id="textoStatus" class="mb-0 fw-bold">Pedido Recebido ⏳</h4>
                </div>

                <div class="progress my-4" style="height: 25px;">
                    <div id="barraProgresso" class="progress-bar progress-bar-striped progress-bar-animated bg-warning" role="progressbar" style="width: 25%;">25%</div>
                </div>

                <div id="detalhesEndereco" class="text-start bg-white p-3 rounded border mb-4">
                    <h6 class="fw-bold mb-2">Endereço de Entrega:</h6>
                    <p id="textoEndereco" class="mb-0 text-muted"></p>
                </div>

                <a href="../index.html" class="btn btn-outline-success w-100">Voltar para o Início</a>
            </div>
        </div>
    </div>

    <script src="../js/carrinho.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const pedido = JSON.parse(sessionStorage.getItem("pedidoAtivo") || "{}");
            if (!pedido.id) {
                window.location.href = "../index.html";
                return;
            }

            document.getElementById("numPedido").textContent = "#" + pedido.id;
            
            if (pedido.endereco) {
                document.getElementById("textoEndereco").textContent = 
                    `${pedido.endereco.rua}, Nº ${pedido.endereco.numero} - ${pedido.endereco.bairro}, ${pedido.endereco.cidade}`;
            }

            setTimeout(() => {
                document.getElementById("textoStatus").textContent = "Em Preparação na Cozinha 🌽";
                document.getElementById("barraProgresso").style.width = "50%";
                document.getElementById("barraProgresso").textContent = "50%";
            }, 3000);

            setTimeout(() => {
                document.getElementById("textoStatus").textContent = "Saiu para Entrega 🛵";
                document.getElementById("barraProgresso").style.width = "75%";
                document.getElementById("barraProgresso").textContent = "75%";
            }, 6000);

            setTimeout(() => {
                document.getElementById("textoStatus").textContent = "Pedido Entregue! Bom Apetite! ✅";
                document.getElementById("barraProgresso").style.width = "100%";
                document.getElementById("barraProgresso").classList.remove("bg-warning");
                document.getElementById("barraProgresso").classList.add("bg-success");
                document.getElementById("barraProgresso").textContent = "100%";
            }, 9000);
        });
    </script>
</body>
</html>
