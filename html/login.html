<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Raízes do Nordeste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="auth-box">
    <div class="text-center mb-4">
        <h2>🌽 Raízes do Nordeste</h2>
        <p>Faça login para continuar</p>
    </div>
    
    <div id="mensagem"></div>

    <form id="formLogin">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Digite seu email" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Senha</label>
            <input type="password" id="senha" class="form-control" placeholder="Digite sua senha" required>
        </div>
        <button type="submit" class="btn btn-warning w-100">Entrar</button>
    </form>

    <hr>
    
    <p class="text-center mb-2">Ainda não possui cadastro?</p>
    <a href="cadastro.html" class="btn btn-outline-warning w-100">Criar Conta</a>
    <a href="../index.html" class="btn btn-success w-100 mt-3">Voltar ao Site</a>
</div>

<!-- Scripts de Login -->
<script src="../js/login.js?v=3"></script>
</body>
</html>
