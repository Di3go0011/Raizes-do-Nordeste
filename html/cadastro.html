<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Raízes do Nordeste</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- caminho do CSS -->
<link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
<div class="auth-box">
    <div class="text-center mb-4">
        <h2>🌽 Raízes do Nordeste</h2>
        <p>Crie sua conta</p>
    </div>
    
    <div id="mensagem"></div>

    <form id="formCadastro">
        <div class="mb-3"><label class="form-label">Nome Completo</label><input type="text" id="nome" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Telefone</label><input type="tel" id="telefone" class="form-control" placeholder="(81) 99999-9999" required></div>
        <div class="mb-3"><label class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Senha</label><input type="password" id="senha" class="form-control" minlength="4" required></div>
        <div class="mb-4"><label class="form-label">Confirmar Senha</label><input type="password" id="confirmarSenha" class="form-control" required></div>
        <button type="submit" class="btn btn-warning w-100">Criar Conta</button>
    </form>
    <hr>
    <a href="login.html" class="btn btn-success w-100">Já possuo uma conta</a>
    <a href="../index.html" class="btn btn-outline-secondary w-100 mt-3">Voltar ao Site</a>
</div>

<!-- Corrigido o caminho do JS -->
<script src="../js/cadastro.js?v=4"></script>
</body>
</html>
