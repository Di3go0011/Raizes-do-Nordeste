<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho | Raízes do Nordeste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/carrinho.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <!-- home -->
        <a href="../index.html" class="navbar-brand fw-bold">🌽 Raízes do Nordeste</a>
        
        <div class="d-flex align-items-center gap-2">
            <!-- Adicionado o elemento onde o script desenha o menu do usuário / botão Sair -->
            <div id="menu-usuario"></div>
            <a href="../index.html" class="btn btn-outline-success ms-2">Continuar comprando</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4">Meu Carrinho</h2>
    <div id="listaCarrinho"></div>

    <div id="resumoCarrinho" class="card mt-4 p-4 shadow-sm">
        <div class="d-flex justify-content-between"><span>Subtotal</span><strong>R$ <span id="subtotal">0,00</span></strong></div>
        <div class="d-flex justify-content-between mt-2"><span>Entrega</span><strong>R$ <span id="taxaEntrega">0,00</span></strong></div>
        <hr>
        <div class="d-flex justify-content-between"><h3>Total</h3><h3 class="text-warning">R$ <span id="total">0,00</span></h3></div>
        <div class="mt-3 d-flex gap-2 flex-wrap">
            <button type="button" class="btn btn-danger" onclick="limparCarrinho()">Limpar Carrinho</button>
            <a href="checkout.html" id="btnFinalizar" class="btn btn-success">Finalizar Pedido</a>
        </div>
    </div>
</div>

<script src="../js/carrinho.js?v=3"></script>
</body>
</html>
